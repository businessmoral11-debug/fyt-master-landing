# TEMPORARY - redesign branch only. Builds the site, runs tests and takes
# desktop/mobile screenshots, then pushes the results to the `ci-screens`
# branch so the redesign can be reviewed. Never deploys anywhere.
# Remove this file (and scripts/ci-screens.mjs) before merging redesign -> main.
name: Redesign preview screenshots

on:
  push:
    branches: [redesign]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redesign-preview
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test, build, screenshot
        run: |
          set +e
          mkdir -p ci-out
          echo "sha=${GITHUB_SHA}" > ci-out/info.txt
          date -u >> ci-out/info.txt
          npm test > ci-out/test.txt 2>&1; echo "exit $?" >> ci-out/test.txt
          VITE_BASE_PATH=/ npm run build > ci-out/build.txt 2>&1; B=$?; echo "exit $B" >> ci-out/build.txt
          if [ $B -eq 0 ]; then
            (cd dist && find . -type f -printf '%s\t%p\n' | sort -rn) > ci-out/dist-sizes.txt
            npm i --no-save playwright@1.55.0 > /dev/null 2>&1
            npx playwright install --with-deps chromium > /dev/null 2>&1
            VITE_BASE_PATH=/ npx vite preview --port 4173 --strictPort --host 127.0.0.1 > ci-out/preview.txt 2>&1 &
            sleep 4
            node scripts/ci-screens.mjs > ci-out/screens.txt 2>&1; echo "exit $?" >> ci-out/screens.txt
            # Same smoothness benchmark against saved v1 and the live main branch, for comparison.
            for ref in redesign-v1 main; do
              git fetch -q --depth 1 origin "$ref" && git worktree add -q "/tmp/cmp-$ref" FETCH_HEAD
              (cd "/tmp/cmp-$ref" && npm ci > /dev/null 2>&1 && VITE_BASE_PATH=/ npm run build > /dev/null 2>&1)
              (cd "/tmp/cmp-$ref" && VITE_BASE_PATH=/ npx vite preview --port 4174 --strictPort --host 127.0.0.1 > /dev/null 2>&1 &)
              sleep 4
              SCREENS_URL=http://127.0.0.1:4174/ BENCH_ONLY=1 BENCH_LABEL="$ref" node scripts/ci-screens.mjs >> ci-out/screens.txt 2>&1
              pkill -f "port 4174" || true
              sleep 1
            done
          fi
          exit 0

      - name: Publish results to ci-screens branch
        run: |
          cd ci-out
          printf '{ "git": { "deploymentEnabled": false } }\n' > vercel.json
          git init -q
          git config user.name "redesign-ci"
          git config user.email "redesign-ci@users.noreply.github.com"
          git checkout -q -b ci-screens
          git add -A
          git commit -q -m "screens for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screens
