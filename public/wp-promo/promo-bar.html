<!-- ===================== 24-hour flash sale ("Black Friday Upgraded") on every WordPress page =====================
  Same rules as the home page: each visitor gets their own 24 hours from their first visit (kept in this browser, and
  signed by the checkout snippet so the checkout checks the same deadline). During those hours the flash bar (fyt-fs60) shows
  instead of the Black Friday bar. When their 24 hours end, the page reloads once and the normal Black Friday bar comes back.
  FLASH_MODE: 'off' | 'preview' (only browsers that opened a page with ?flash=1) | 'live' (everyone). -->
<script>
(function () {
  var FLASH_MODE = 'preview', OFF = 60, HOURS = 24, LAST_START = '2026-12-01T17:00:00+05:30';
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
  var q = location.search;
  if (/[?&]flash=(1|reset)(&|$)/.test(q)) ls('fyt_flash_preview', '1');
  if (/[?&]flash=off(&|$)/.test(q)) ls('fyt_flash_preview', null);
  if (/[?&]flash=reset(&|$)/.test(q)) ls('fyt_flash_start', null);
  if (!(FLASH_MODE === 'live' || (FLASH_MODE === 'preview' && ls('fyt_flash_preview') === '1'))) return;
  if (document.getElementById('fyt-custom-checkout') || /\/checkout(\/|$)/.test(location.pathname)) return;
  var now = Date.now(), start = Number(ls('fyt_flash_start')) || 0;
  if (!start) { if (now > new Date(LAST_START).getTime()) return; start = now; ls('fyt_flash_start', String(start)); }
  var end = start + HOURS * 36e5;
  if (now >= end) return;
  window.FYT_FLASH = { off: OFF, end: end };
  // Sign the start time on the server so the checkout gives the same 60% (the earliest start always wins).
  try {
    fetch('/wp-admin/admin-ajax.php?action=fyt_flash_start&s=' + Math.floor(start / 1000), { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j && j.start) ls('fyt_flash_start', String(j.start * 1000)); })
      .catch(function () {});
  } catch (e) {}
  // Back to the normal Black Friday bar the moment their 24 hours end.
  setTimeout(function () { if (!document.hidden) location.reload(); else document.addEventListener('visibilitychange', function () { location.reload(); }, { once: true }); }, end - now + 1500);
})();
</script>

<script>
(function(){
  /* ============================ CONFIG (edit here) ============================ */
  var CONFIG = {
    endDate: '2026-12-01T17:00:00+05:30',  // PLACEHOLDER. Set like '2026-11-30T23:59:59+05:30' (IST). Until set, a "LIMITED TIME" chip shows instead of the countdown.
    couponCode: 'BLACKFRIDAY', // shown on the ticket, copied on click
    ctaUrl: 'https://fundingyourtrades.com/#challenge',
    ctaText: 'Claim 5 Accounts', ctaTextShort: 'Claim', ctaNewTab: false,
    hero: 'BUY 2, GET 5 ACCOUNTS', // static main headline, always visible
    heroShort: 'BUY 2 GET 5',      // used when the long headline does not fit
    // Line under the hero (rotates continuously). tickerShort is used when a line does not fit.
    ticker: ['50% OFF + INSTANT BOGO', 'EVERY PURCHASE = 100K GIVEAWAY ENTRY'],
    tickerShort: ['50% OFF + BOGO', 'WIN A 100K ACCOUNT'],
    srText: 'Black Friday: Buy 2 Get 5 accounts, plus 50% off and Instant BOGO. Every purchase is 1 entry to win a 100K funded account.',
    rotateMs: 2500,
    soonHours: 24, soonText: 'Ends soon',
    whenEnded: 'hide',        // 'hide' removes the bar | 'message' shows endedText
    endedText: 'DEAL ENDED',
    stickyMode: 'fixed',      // 'fixed' (pads <body>) | 'sticky' | 'none' (stays where pasted)
    thinOnScroll: true, thinAfter: 80, // bar gets thin once the page is scrolled this many pixels
    zIndex: 99990,
    brand: ['BLACK', 'FRIDAY'], // the two stacked words on the left
    theme: '',                  // 'flash' = the 24-hour "Black Friday Upgraded" look (gold + red, no days tile)
    endsText: ''                // label next to the timer (empty = "Deal ends in")
  };
  /* =========================================================================== */
  if (window.FYT_BF_CONFIG) for (var k in window.FYT_BF_CONFIG) CONFIG[k] = window.FYT_BF_CONFIG[k];
  var bar = document.getElementById('fyt-bf-bar');
  if (!bar || bar.getAttribute('data-init')) return; bar.setAttribute('data-init', '1');
  // During a visitor's 24-hour flash sale the flash bar (fyt-fs60) shows instead.
  if (window.FYT_FLASH && window.FYT_FLASH.end > Date.now() && !CONFIG.theme) { if (bar.parentNode) bar.parentNode.removeChild(bar); return; }
  // No promo bar on the checkout: nothing should pull the eye away from paying.
  if (document.getElementById('fyt-custom-checkout') || /\/checkout(\/|$)/.test(location.pathname)) { if (bar.parentNode) bar.parentNode.removeChild(bar); return; }
  var $ = function(s){ return bar.querySelector(s); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var esc = function(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  bar.style.zIndex = CONFIG.zIndex;
  if (CONFIG.theme) bar.classList.add('fbf-' + CONFIG.theme);
  if (CONFIG.brand && CONFIG.brand.length === 2) {
    bar.querySelectorAll('.fbf-brand .fbf-bk, .fbf-eb .fbf-bk').forEach(function(e){ e.textContent = CONFIG.brand[0]; });
    bar.querySelectorAll('.fbf-brand .fbf-fr, .fbf-eb .fbf-fr').forEach(function(e){ e.textContent = CONFIG.brand[1]; });
    bar.setAttribute('aria-label', CONFIG.brand.join(' ') + ' offer');
  }
  if (CONFIG.endsText) $('.fbf-ends').textContent = CONFIG.endsText;
  $('.fbf-full').textContent = CONFIG.srText;
  $('.fbf-cv').textContent = CONFIG.couponCode;
  var code = $('.fbf-code'); code.setAttribute('aria-label', 'Copy coupon code ' + CONFIG.couponCode);
  var cta = $('.fbf-cta'); cta.href = CONFIG.ctaUrl; cta.setAttribute('aria-label', CONFIG.ctaText);
  $('.fbf-cl').textContent = CONFIG.ctaText; $('.fbf-cs').textContent = CONFIG.ctaTextShort || CONFIG.ctaText;
  if (CONFIG.ctaNewTab) { cta.target = '_blank'; cta.rel = 'noopener'; }
  $('.fbf-over').textContent = CONFIG.endedText;
  var heroT = $('.fbf-hero-t'), heroG = $('.fbf-hero-glow');
  function setHero(t){ heroT.textContent = t; heroG.textContent = t; }
  setHero(CONFIG.hero);
  $('.fbf-tick').innerHTML = CONFIG.ticker.map(function(t){ return '<span><span class="fbf-chip">' + esc(t) + '</span></span>'; }).join('');
  /* sparkles */
  if (!reduce) for (var i = 0; i < 9; i++) { var s = document.createElement('i'); s.className = 'fbf-spk'; s.setAttribute('aria-hidden', 'true');
    s.style.cssText = 'left:' + (3 + i * 10.6 + Math.random() * 4).toFixed(1) + '%;top:' + (12 + Math.random() * 70).toFixed(0) + '%;animation-delay:' + (-Math.random() * 3.2).toFixed(2) + 's'; bar.appendChild(s); }
  /* rotators */
  function rotator(box){ var items = box.children, n = items.length, idx = 0; if (!n) return; items[0].classList.add('on');
    if (n < 2) return;
    setInterval(function(){ if (document.hidden) return; var cur = items[idx]; idx = (idx + 1) % n; var nx = items[idx];
      cur.classList.add('out'); cur.classList.remove('on'); nx.classList.remove('out'); nx.classList.add('on');
      setTimeout(function(){ cur.classList.remove('out'); }, 520); }, reduce ? CONFIG.rotateMs * 1.6 : CONFIG.rotateMs); }
  rotator($('.fbf-tick'));
  /* placement */
  var body = document.body, root = document.documentElement, basePad = null, adminBar = document.getElementById('wpadminbar'), raf = null;
  function place(){ raf = null; if (bar.classList.contains('fbf-hide')) return; fit(); var top = 0;
    if (adminBar) { var cs = getComputedStyle(adminBar); if (cs.display !== 'none') top = cs.position === 'fixed' ? adminBar.offsetHeight : Math.max(0, adminBar.offsetHeight - (window.pageYOffset || 0)); }
    bar.style.setProperty('--fbf-top', top + 'px'); root.style.setProperty('--fyt-bf-h', bar.offsetHeight + 'px');
    if (CONFIG.stickyMode === 'fixed' && !bar.classList.contains('fbf-thin')) { if (basePad === null) basePad = parseFloat(getComputedStyle(body).paddingTop) || 0; body.style.paddingTop = (basePad + bar.offsetHeight) + 'px'; } }
  function fit(){
    if (!heroT) return;
    var offer = $('.fbf-offer'), tick = $('.fbf-tick'), room = offer ? offer.clientWidth : 0;
    heroT.style.fontSize = ''; heroG.style.fontSize = '';
    setHero(CONFIG.hero);
    var tooWide = function(){ return room && heroT.getBoundingClientRect().width > room - 4; };
    if (tooWide()) setHero(CONFIG.heroShort);
    var f = parseFloat(getComputedStyle(heroT).fontSize);
    while (tooWide() && f > 12) { f -= .5; heroT.style.fontSize = f + 'px'; heroG.style.fontSize = f + 'px'; }
    if (tick) {
      var chips = tick.querySelectorAll('.fbf-chip'), shorts = CONFIG.tickerShort || CONFIG.ticker, i, maxW, cf;
      tick.style.width = 'auto';
      for (i = 0; i < chips.length; i++) { chips[i].style.fontSize = ''; chips[i].textContent = CONFIG.ticker[i] || ''; }
      var chipWide = function(){ maxW = 0; for (i = 0; i < chips.length; i++) maxW = Math.max(maxW, chips[i].getBoundingClientRect().width); return room && maxW > room - 4; };
      if (chipWide()) for (i = 0; i < chips.length; i++) chips[i].textContent = shorts[i] || CONFIG.ticker[i] || '';
      cf = chips[0] ? parseFloat(getComputedStyle(chips[0]).fontSize) : 12;
      while (chipWide() && cf > 8) { cf -= .5; for (i = 0; i < chips.length; i++) chips[i].style.fontSize = cf + 'px'; }
      if (room) maxW = Math.min(maxW, room);
      if (maxW) tick.style.width = Math.ceil(maxW) + 'px';
    }
  }
  function sched(){ if (!raf) raf = requestAnimationFrame(place); }
  function unplace(){ root.style.removeProperty('--fyt-bf-h'); if (basePad !== null) body.style.paddingTop = basePad ? basePad + 'px' : ''; }
  if (CONFIG.stickyMode === 'fixed') { if (bar.parentNode !== body) body.insertBefore(bar, body.firstChild); bar.classList.add('fbf-fixed'); }
  else if (CONFIG.stickyMode === 'sticky') bar.classList.add('fbf-sticky');
  place(); addEventListener('resize', sched); if (adminBar) addEventListener('scroll', sched, { passive: true });
  if (CONFIG.thinOnScroll) { var onScroll = function(){ var thin = (window.pageYOffset || root.scrollTop || 0) > CONFIG.thinAfter; if (thin !== bar.classList.contains('fbf-thin')) { bar.classList.toggle('fbf-thin', thin); sched(); setTimeout(sched, 320); } }; addEventListener('scroll', onScroll, { passive: true }); onScroll(); }
  /* countdown */
  var end = new Date(CONFIG.endDate).getTime(), tiles = {}, prev = {}, lastMin = -1, timer = null, tsr = $('.fbf-tsr'), endsEl = $('.fbf-ends'), endsTxt = endsEl.textContent;
  ['d','h','m','s'].forEach(function(u){ tiles[u] = bar.querySelector('.fbf-t[data-u="' + u + '"]'); });
  var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
  function tick(){ var left = end - Date.now();
    if (!(left > 0)) { clearInterval(timer); if (CONFIG.whenEnded === 'hide') { bar.classList.add('fbf-hide'); unplace(); } else { bar.classList.add('fbf-ended'); tsr.textContent = CONFIG.endedText; } return; }
    var soon = left <= CONFIG.soonHours * 36e5; if (soon !== bar.classList.contains('fbf-soon')) { bar.classList.toggle('fbf-soon', soon); endsEl.textContent = soon ? CONFIG.soonText : endsTxt; }
    var s = Math.floor(left / 1000), v = { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
    for (var u in v) if (prev[u] !== v[u]) { var t = tiles[u]; t.firstChild.textContent = pad(v[u]);
      if (!reduce && prev[u] !== undefined) { t.classList.remove('fbf-flip'); void t.offsetWidth; t.classList.add('fbf-flip'); } prev[u] = v[u]; }
    var tm = Math.floor(s / 60); if (tm !== lastMin) { lastMin = tm; tsr.textContent = 'Deal ends in ' + v.d + ' days, ' + v.h + ' hours, ' + v.m + ' minutes'; } }
  if (isNaN(end)) bar.classList.add('fbf-nodate'); else { tick(); timer = setInterval(tick, 1000); }
  /* copy code */
  var cv = $('.fbf-cv'), csr = $('.fbf-csr'), rt;
  function legacy(t){ var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
    body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch(e){} body.removeChild(ta); return ok; }
  function done(ok){ clearTimeout(rt); if (ok) { code.classList.add('fbf-ok'); cv.textContent = 'COPIED!'; csr.textContent = 'Code ' + CONFIG.couponCode + ' copied'; }
    else csr.textContent = 'Code: ' + CONFIG.couponCode;
    rt = setTimeout(function(){ code.classList.remove('fbf-ok'); cv.textContent = CONFIG.couponCode; csr.textContent = ''; }, 2000); }
  code.addEventListener('click', function(){ var c = CONFIG.couponCode;
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(c).then(function(){ done(true); }, function(){ done(legacy(c)); }); else done(legacy(c)); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sched);
})();

<!-- ======================================================================
  FYT 24-HOUR FLASH SALE TOP BAR  (fyt-fs60)  "Black Friday Upgraded", based on the fyt-flash60 design
  Shows ONLY while window.FYT_FLASH is set (the visitor's own 24 hours, set by the flash script before it).
  Otherwise it removes itself and the normal Black Friday bar shows.
  HTML + CSS + vanilla JS. No images, no libraries. Fonts: Unbounded + Inter (Google Fonts).
  Paste once: WordPress Custom HTML block / header-footer hook (wp_body_open or wp_footer) / GTM Custom HTML.
  It moves itself to the top of <body>, stays fixed while scrolling and pads <body> so nothing is covered.
  It sets --fyt-fs60-h (bar height) on <html>: give a sticky site header  top: var(--fyt-fs60-h, 0px).
  To change the end time, edit CONFIG.endDate in the <script> (ISO string WITH an offset, e.g. +05:30).
  No close button by design. Every class and ID is prefixed fyt-fs60-.
====================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
#fyt-fs60-bar,#fyt-fs60-bar *,#fyt-fs60-bar *::before,#fyt-fs60-bar *::after{box-sizing:border-box;margin:0;padding:0}
#fyt-fs60-bar{--gd1:#FFF1B8;--gd2:#FFD25A;--gd3:#F2A81D;--gd4:#B8730A;--gold:#FFC845;--blue:#348CFC;--blue2:#0767F7;--ok:#3BE38B;
  position:relative;z-index:99990;width:100%;overflow:hidden;isolation:isolate;color:#fff;background:#000;
  font:500 13px/1.2 Inter,Arial,Helvetica,sans-serif;text-align:left;-webkit-font-smoothing:antialiased;
  box-shadow:0 10px 30px rgba(0,0,0,.65),0 1px 0 rgba(255,200,69,.18)}
#fyt-fs60-bar.fyt-fs60-fixed{position:fixed;left:0;right:0;top:var(--fyt-fs60-top,0px)}
#fyt-fs60-bar.fyt-fs60-sticky{position:sticky;top:var(--fyt-fs60-top,0px)}

/* ---------- background lights ---------- */
#fyt-fs60-bar .fyt-fs60-bg{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(34% 190% at 5% 55%,rgba(52,140,252,.42),transparent 70%),
             radial-gradient(30% 170% at 56% 130%,rgba(255,176,32,.22),transparent 70%),
             radial-gradient(26% 150% at 96% 20%,rgba(255,200,69,.14),transparent 70%),
             linear-gradient(180deg,#07090e 0%,#000 55%,#05070b 100%)}
#fyt-fs60-bar .fyt-fs60-topline{position:absolute;left:0;right:0;top:0;height:1px;z-index:5;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(52,140,252,.8) 14%,rgba(255,225,140,.85) 50%,rgba(255,200,69,.5) 86%,transparent)}
#fyt-fs60-bar .fyt-fs60-sweep{position:absolute;top:-10%;bottom:-10%;left:0;width:18%;z-index:4;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent 0,rgba(255,226,150,.10) 40%,rgba(255,244,210,.22) 50%,rgba(255,226,150,.10) 60%,transparent 100%);
  transform:translate3d(-120%,0,0) skewX(-20deg);animation:fyt-fs60-sweep 7.5s cubic-bezier(.45,.05,.3,1) 1.2s infinite;will-change:transform,opacity}
#fyt-fs60-bar .fyt-fs60-spk{position:absolute;z-index:1;width:3px;height:3px;border-radius:50%;background:#FFE9A8;box-shadow:0 0 7px 2px rgba(255,200,69,.8);opacity:0;pointer-events:none;animation:fyt-fs60-tw 3.6s ease-in-out infinite}
/* ---------- edge progress (depleting bar) ---------- */
#fyt-fs60-bar .fyt-fs60-edge{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:6;background:rgba(255,255,255,.07);pointer-events:none;overflow:hidden}
#fyt-fs60-bar .fyt-fs60-edgefill{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(1);transition:transform 1s linear;
  background:linear-gradient(90deg,var(--blue2),var(--blue) 35%,#FFE08A 78%,var(--gold));box-shadow:0 0 12px rgba(255,200,69,.55)}
/* ---------- layout ---------- */
#fyt-fs60-bar .fyt-fs60-in{position:relative;z-index:3;max-width:1360px;margin:0 auto;padding:8px 24px 11px;min-height:84px;display:flex;align-items:center;justify-content:center;gap:20px;animation:fyt-fs60-enter .8s cubic-bezier(.2,.8,.2,1) both}

#fyt-fs60-bar .fyt-fs60-dialw{--d:68px;--w:3px;position:relative;flex:none;grid-area:dial;width:var(--d);height:var(--d)}
#fyt-fs60-bar .fyt-fs60-rim{position:absolute;inset:0;filter:drop-shadow(0 0 5px rgba(52,140,252,.85)) drop-shadow(0 0 12px rgba(52,140,252,.35))}
#fyt-fs60-bar .fyt-fs60-rbase{position:absolute;inset:0;border-radius:50%;border:var(--w) solid rgba(52,140,252,.16)}
#fyt-fs60-bar .fyt-fs60-hf{position:absolute;top:0;height:100%;width:50%;overflow:hidden}
#fyt-fs60-bar .fyt-fs60-hf-r{right:0}#fyt-fs60-bar .fyt-fs60-hf-l{left:0}

<script>
(function(){
  /* ============================ CONFIG: edit here ============================ */
  var CONFIG = {
    endDate:   '',                           // set from window.FYT_FLASH.end (each visitor's own deadline)
    saleHours: 24,                           // length of the sale, drives the progress ring + bar
    whenEnded: 'hide',                       // 'hide' | 'message'
    couponCode:'BLACKFRIDAY',                // shown on the pill and copied on click
    ctaUrl:    'https://fundingyourtrades.com/#challenge',
    stickyMode:'fixed',                      // 'fixed' (default) | 'sticky' | 'none'
    copy: {
      eyebrow:'Black Friday upgraded', every:'50% off', big:'60% off',
      codeLabel:'Code', copied:'Copied', endsIn:'Ends in', hrs:'HRS', min:'MIN', sec:'SEC',
      cta:'Claim 60% Off',
      endedEyebrow:'Black Friday upgraded', endedEvery:'Flash sale', endedBig:'ended',
      endedText:'The flash sale has ended', endedCta:'View Challenges'
    }
  };
  /* Optional override without editing this file: set window.FYT_FS60_CONFIG = {...} before this snippet. */
  var ov = window.FYT_FS60_CONFIG || {};
  for (var k in ov){ if(k==='copy'){ for (var c in ov.copy) CONFIG.copy[c]=ov.copy[c]; } else CONFIG[k]=ov[k]; }
  /* ========================================================================== */

  var bar = document.getElementById('fyt-fs60-bar');
  if (!bar || bar.getAttribute('data-fyt-fs60-init')) return;
  // Only during the visitor's 24 hours, and never on the checkout.
  var FL = window.FYT_FLASH;
  if (!FL || !(FL.end > Date.now()) || document.getElementById('fyt-custom-checkout') || /\/checkout(\/|$)/.test(location.pathname)) { if (bar.parentNode) bar.parentNode.removeChild(bar); return; }
  if (!CONFIG.endDate) CONFIG.endDate = new Date(FL.end).toISOString();
  bar.setAttribute('data-fyt-fs60-init','1');
  var $ = function(id){ return document.getElementById('fyt-fs60-'+id); };
  var T = CONFIG.copy, root = document.documentElement, body = document.body;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var endMs = Date.parse(CONFIG.endDate);
  var totalMs = CONFIG.saleHours*3600000, startMs = endMs - totalMs;

  // move to top of <body>, positioning
  if (CONFIG.stickyMode !== 'none' && (bar.parentNode !== body || body.firstChild !== bar)) body.insertBefore(bar, body.firstChild);
  bar.classList.remove('fyt-fs60-fixed');
  if (CONFIG.stickyMode==='fixed') bar.classList.add('fyt-fs60-fixed');
  else if (CONFIG.stickyMode==='sticky') bar.classList.add('fyt-fs60-sticky');

  // copy
  $('eb').textContent=T.eyebrow; $('every').textContent=T.every; $('big').textContent=T.big;
  (function(){ var w=$('shms'), n=9, i, s; w.style.display='contents';
    for (i=0;i<n;i++){ s=document.createElement('span'); s.className='fyt-fs60-shm'; s.style.setProperty('--i',i); s.style.setProperty('--p',(-6+i*14)+'%'); s.textContent=T.big; w.appendChild(s); } })();
  $('codelabel').textContent=T.codeLabel; $('codeval').textContent=CONFIG.couponCode; $('copiedtxt').textContent=T.copied;
  $('ends').textContent=T.endsIn; $('lh').textContent=T.hrs; $('lm').textContent=T.min; $('ls').textContent=T.sec;
  $('ctat').textContent=T.cta; $('cta').href=CONFIG.ctaUrl;
  $('code').setAttribute('aria-label','Copy code '+CONFIG.couponCode);

  // padding so the fixed bar never covers the page
  var basePad = parseFloat(getComputedStyle(body).paddingTop)||0;
  function fit(){
    var h = bar.classList.contains('fyt-fs60-hide') ? 0 : Math.round(bar.getBoundingClientRect().height);
    root.style.setProperty('--fyt-fs60-h', h+'px');
    root.style.setProperty('--fyt-bf-h', h+'px'); // the site header already follows the Black Friday bar height
    if (CONFIG.stickyMode==='fixed') body.style.paddingTop = (basePad+h)+'px';
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(bar); else window.addEventListener('resize',fit);
  fit();

  // digits
  var cells = bar.querySelectorAll('.fyt-fs60-dg'); // h1 h2 m1 m2 s1 s2
  var shown = ['','','','','',''];
  function setDigit(i,ch,animate){
    if (shown[i]===ch) return; shown[i]=ch;
    var cell = cells[i], nw = document.createElement('span');
    nw.className='fyt-fs60-n'; nw.textContent=ch;
    var old = cell.querySelector('.fyt-fs60-n:not(.fyt-fs60-out-n)');
    if (animate && !reduce && old){
      old.classList.add('fyt-fs60-out-n'); nw.classList.add('fyt-fs60-in-n');
      var rm = function(){ if(old.parentNode) old.parentNode.removeChild(old); };
      old.addEventListener('animationend',rm); setTimeout(rm,600);
      cell.appendChild(nw);
    } else { cell.textContent=''; cell.appendChild(nw); }
  }
  function pad2(n){ return (n<10?'0':'')+n; }

  // ring + edge + hand
  var rr=$('rr'), rl=$('rl'), tipw=$('tipw'), hand=$('hand'), edge=$('edgefill');
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function setProgress(frac){ // frac = share of the 24h still left (1 -> 0)
    var th = clamp(frac,0,1)*360;
    rr.style.transform='rotate('+(clamp(th,0,180)-180)+'deg)';
    rl.style.transform='rotate('+(clamp(th,180,360)-360)+'deg)';
    tipw.style.transform='rotate('+th+'deg)';
    edge.style.transform='scaleX('+clamp(frac,0,1)+')';
  }

  var ended=false, lastSr=-1, handAngle=0;
  function render(first){
    var now = Date.now(), left = endMs-now;
    if (left<=0){ if(!ended) showEnded(); return; }
    var s = Math.floor(left/1000), h = Math.min(99,Math.floor(s/3600)), m = Math.floor(s%3600/60), sec = s%60;
    var a = !first && !document.hidden;
    var hh=pad2(h), mm=pad2(m), ss=pad2(sec);
    setDigit(0,hh[0],a);setDigit(1,hh[1],a);setDigit(2,mm[0],a);setDigit(3,mm[1],a);setDigit(4,ss[0],a);setDigit(5,ss[1],a);
    setProgress(left/totalMs);
    handAngle = Math.floor((now-startMs)/1000)*6; hand.style.transform='rotate('+handAngle+'deg)';
    var mins = Math.floor(s/60);
    if (mins!==lastSr){ lastSr=mins; $('sr').textContent='Black Friday upgraded: 60% off everything instead of 50%, with code '+CONFIG.couponCode+'. Buy 1 get 2 instantly, buy 2 get 5 instantly. Your 24 hours end in '+h+' hours '+m+' minutes.'; }
  }
  function showEnded(){
    ended=true;
    if (CONFIG.whenEnded === 'hide') { clearInterval(timer); bar.classList.add('fyt-fs60-hide'); bar.style.display='none'; fit(); return; }
    bar.classList.add('fyt-fs60-ended');
    $('eb').textContent=T.endedEyebrow; $('every').textContent=T.endedEvery; $('big').textContent=T.endedBig; $('shms').textContent='';
    $('ctat').textContent=T.endedCta;
    for (var i=0;i<6;i++) setDigit(i,'0',false);
    setProgress(0); $('sr').textContent=T.endedText+'.';
    clearInterval(timer); fit();
  }

  // click-to-copy
  var codeBtn=$('code'), copyT;
  function done(){ codeBtn.classList.add('fyt-fs60-copied'); clearTimeout(copyT); copyT=setTimeout(function(){ codeBtn.classList.remove('fyt-fs60-copied'); },1800); }
  function legacyCopy(txt){ try{ var ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select(); var ok=document.execCommand('copy'); document.body.removeChild(ta); return ok; }catch(e){ return false; } }
  codeBtn.addEventListener('click',function(){
    var txt=CONFIG.couponCode;
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,function(){ if(legacyCopy(txt)) done(); }); }
    else if (legacyCopy(txt)) done();
  });

  // pause animations in hidden tabs
  function vis(){ bar.classList.toggle('fyt-fs60-paused',document.hidden); if(!document.hidden) render(false); }
  document.addEventListener('visibilitychange',vis);

  render(true);
  // enable smooth transitions only after first paint (no ring sweep-in on load)
  var timer = setInterval(function(){ if(!document.hidden) render(false); },1000);
  if (ended) clearInterval(timer);
  if (document.hidden) bar.classList.add('fyt-fs60-paused');
})();
</script>


<!-- ===================== Site-wide: old offers in the WordPress header and footer -> current offer =====================
  The Elementor header still carries an old scrolling offer line (Summer40, 47.5% off with crypto, 200% refund...).
  This swaps those words for the current offer on every WordPress page. When the offer changes, edit FYT_CURRENT_OFFER only. -->
<script>
(function () {
  var FL = window.FYT_FLASH;
  var FYT_CURRENT_OFFER = FL ? {
    code: 'BLACKFRIDAY',
    swaps: [
      [/summer\s*special[^<>]*?40%\s*off\s*\+\s*2\s*accounts\s*instantly/gi, 'Black Friday Upgraded: ' + FL.off + '% Off Everything'],
      [/47\.5%\s*off\s*with\s*crypto\s*\+\s*2\s*accounts\s*instantly(\s*same\s*size)?/gi, 'Buy 2 Get 5 Instantly'],
      [/200%\s*refund\s*\+\s*1st\s*reward\s*on\s*demand/gi, 'Buy 1 Get 2 Instantly'],
      [/40%\s*off\s*\+\s*2\s*accounts\s*instantly(\s*same\s*size)?/gi, FL.off + '% Off Everything'],
      [/limited[-\s]*time\s*deal\s*[-\u2013\u00b7]\s*limited\s*spots/gi, 'Your 24 Hours Only'],
      [/summer\s*special/gi, 'Black Friday Upgraded']
    ],
    oldCodes: /\b(SUMMER40|FYT40|BOGO35|DIWALI45|FYTWEEN|NEWDASH)\b/gi
  } : {
    code: 'BLACKFRIDAY',
    swaps: [
      [/summer\s*special[^<>]*?40%\s*off\s*\+\s*2\s*accounts\s*instantly/gi, 'Black Friday: 50% Off + 1 Free Account'],
      [/47\.5%\s*off\s*with\s*crypto\s*\+\s*2\s*accounts\s*instantly(\s*same\s*size)?/gi, 'Extra 5% Off When You Pay With Crypto'],
      [/200%\s*refund\s*\+\s*1st\s*reward\s*on\s*demand/gi, 'Free First Payout on Demand'],
      [/40%\s*off\s*\+\s*2\s*accounts\s*instantly(\s*same\s*size)?/gi, 'Buy 2, Get 5 Accounts'],
      [/limited[-\s]*time\s*deal\s*[-\u2013\u00b7]\s*limited\s*spots/gi, 'Daily 100K Funded Account Giveaway'],
      [/summer\s*special/gi, 'Black Friday']
    ],
    oldCodes: /\b(SUMMER40|FYT40|BOGO35|DIWALI45|FYTWEEN|NEWDASH)\b/gi
  };
  var AREAS = '[data-elementor-type="header"], [data-elementor-type="footer"], header.site-header, footer.site-footer';
  function fixText(node) {
    var t = node.nodeValue, n = t;
    FYT_CURRENT_OFFER.swaps.forEach(function (p) { n = n.replace(p[0], p[1]); });
    n = n.replace(FYT_CURRENT_OFFER.oldCodes, FYT_CURRENT_OFFER.code);
    if (n !== t) node.nodeValue = n;
  }
  function fixAttrs(el) {
    for (var i = 0; i < el.attributes.length; i++) {
      var a = el.attributes[i];
      if (/^(data-|onclick|title|aria-label|value)/i.test(a.name) && FYT_CURRENT_OFFER.oldCodes.test(a.value)) {
        FYT_CURRENT_OFFER.oldCodes.lastIndex = 0;
        el.setAttribute(a.name, a.value.replace(FYT_CURRENT_OFFER.oldCodes, FYT_CURRENT_OFFER.code));
      }
      FYT_CURRENT_OFFER.oldCodes.lastIndex = 0;
    }
  }
  function run() {
    if (document.getElementById('fyt-custom-checkout')) return;
    document.querySelectorAll(AREAS).forEach(function (root) {
      var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nd;
      while ((nd = w.nextNode())) { if (nd.parentNode && !/^(SCRIPT|STYLE)$/.test(nd.parentNode.nodeName)) fixText(nd); }
      fixAttrs(root); root.querySelectorAll('*').forEach(fixAttrs);
    });
  }
  // Copy buttons in the old ticker: make them copy the current code.
  document.addEventListener('copy', function (e) {
    try {
      var sel = String(window.getSelection() || '');
      if (FYT_CURRENT_OFFER.oldCodes.test(sel)) { e.clipboardData.setData('text/plain', sel.replace(FYT_CURRENT_OFFER.oldCodes, FYT_CURRENT_OFFER.code)); e.preventDefault(); }
      FYT_CURRENT_OFFER.oldCodes.lastIndex = 0;
    } catch (x) {}
  }, true);
  if (navigator.clipboard && navigator.clipboard.writeText && !navigator.clipboard.__fytWrapped) {
    var orig = navigator.clipboard.writeText.bind(navigator.clipboard);
    navigator.clipboard.writeText = function (t) { FYT_CURRENT_OFFER.oldCodes.lastIndex = 0; return orig(String(t).replace(FYT_CURRENT_OFFER.oldCodes, FYT_CURRENT_OFFER.code)); };
    navigator.clipboard.__fytWrapped = true;
  }
  run();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  // Tickers often clone their items after load; keep fixing for a few seconds.
  var mo = new MutationObserver(function () { run(); });
  document.querySelectorAll(AREAS).forEach(function (r) { mo.observe(r, { childList: true, subtree: true }); });
  setTimeout(function () { run(); mo.disconnect(); }, 8000);
})();
</script>

<!-- ===================== Site-wide: point every Discord link to the current invite ===================== -->
<script>
(function(){
  var NEW = 'https://discord.gg/6NYNSAwxeZ';
  function fix(root){
    var links = (root || document).querySelectorAll('a[href*="discord.gg/"],a[href*="discord.com/invite/"]');
    for (var i = 0; i < links.length; i++) { if (links[i].href !== NEW) links[i].href = NEW; }
  }
  fix();
  if (window.MutationObserver) {
    var mo = new MutationObserver(function(){ fix(); });
    mo.observe(document.documentElement, { childList: true, subtree: true });
    setTimeout(function(){ mo.disconnect(); }, 15000);
  }
})();
</script>
