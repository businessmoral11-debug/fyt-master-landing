<!-- ==================================================================
  FYT DIWALI SPECIAL STICKY TOP BAR  v2 (WordPress version: DIWALI45, shows 5 Nov 10:00 AM IST to 12 Nov 11:59 PM IST, folds thin on scroll)  (paste-in snippet, no libraries, no images)
  Paste once into: WordPress > Custom HTML block, or a header/footer hook (e.g. wp_body_open / wp_footer).
  It moves itself to the top of <body>, stays fixed at the top while scrolling and pads the page so nothing is covered.
  Edit the CONFIG object in the <script> below (end date, code, copy, CTA).
=================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
#fyt-dw-bar,#fyt-dw-bar *,#fyt-dw-bar *::before,#fyt-dw-bar *::after{box-sizing:border-box;margin:0;padding:0}
#fyt-dw-bar{
  --fyt-dw-gold:#FFC845;--fyt-dw-saffron:#FF9933;
  position:relative;z-index:99990;width:100%;overflow:hidden;isolation:isolate;min-height:96px;
  font-family:'Open Sans',Arial,sans-serif;line-height:1.2;color:#fff;text-align:left;
  background:linear-gradient(90deg,#0B1440 0%,#1A3AA8 30%,#2257E0 50%,#1A3AA8 70%,#0B1440 100%);
  -webkit-font-smoothing:antialiased;box-shadow:0 8px 28px rgba(4,7,13,.45)}
#fyt-dw-bar.fyt-dw-fixed{position:fixed;left:0;right:0;top:var(--fyt-dw-top,0px)}
#fyt-dw-bar.fyt-dw-sticky{position:sticky;top:var(--fyt-dw-top,0px)}
#fyt-dw-bar.fyt-dw-hidden{display:none!important}
#fyt-dw-bar .fyt-dw-veil{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 140% at 50% 130%,rgba(255,153,51,.20),rgba(255,153,51,0) 70%),
             radial-gradient(18% 120% at 6% 40%,rgba(255,170,60,.22),rgba(255,170,60,0) 70%),
             radial-gradient(18% 120% at 94% 40%,rgba(255,170,60,.22),rgba(255,170,60,0) 70%),
             linear-gradient(180deg,rgba(4,7,13,.62) 0%,rgba(6,17,43,.38) 50%,rgba(7,22,50,.66) 100%)}
#fyt-dw-bar .fyt-dw-edge{position:absolute;left:0;right:0;height:1px;z-index:5;pointer-events:none;background:linear-gradient(90deg,rgba(255,200,69,0),rgba(255,214,120,.75) 50%,rgba(255,200,69,0))}
#fyt-dw-bar .fyt-dw-edge--t{top:0;opacity:.6}
#fyt-dw-bar .fyt-dw-edge--b{bottom:0}
#fyt-dw-bar .fyt-dw-fx{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* rangoli mandalas */
#fyt-dw-bar .fyt-dw-rangoli{position:absolute;top:50%;width:220px;height:220px;margin-top:-110px;z-index:0;opacity:.16;pointer-events:none;animation:fyt-dw-spin 120s linear infinite}
#fyt-dw-bar .fyt-dw-rangoli--l{left:-70px}
#fyt-dw-bar .fyt-dw-rangoli--r{right:-70px;animation-direction:reverse}
#fyt-dw-bar .fyt-dw-rangoli--c{left:50%;width:420px;height:420px;margin:-210px 0 0 -210px;opacity:.05;animation-duration:200s}

/* bokeh + petals */
#fyt-dw-bar .fyt-dw-bokeh{position:absolute;z-index:1;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,226,154,.55) 0%,rgba(255,200,69,.18) 45%,rgba(255,200,69,0) 70%);animation:fyt-dw-drift 9s ease-in-out infinite}
#fyt-dw-bar .fyt-dw-petal{position:absolute;top:-14px;z-index:2;width:7px;height:10px;pointer-events:none;opacity:0;border-radius:70% 0 70% 0;
  background:linear-gradient(135deg,#FFD24A,#FF8C00 70%,#E25A00);animation:fyt-dw-fall 11s linear infinite}

/* lanterns */
#fyt-dw-bar .fyt-dw-lantern{position:absolute;top:0;z-index:3;pointer-events:none;transform-origin:50% 0;animation:fyt-dw-sway 5.2s ease-in-out infinite}
#fyt-dw-bar .fyt-dw-lantern svg{position:relative;display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 7px rgba(255,140,40,.55))}
#fyt-dw-bar .fyt-dw-lhalo{position:absolute;left:50%;top:40%;width:260%;height:150%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,176,70,.42) 0%,rgba(255,140,40,.14) 40%,rgba(255,140,40,0) 70%);animation:fyt-dw-glow 3.4s ease-in-out infinite}
#fyt-dw-bar .fyt-dw-tas{transform-box:fill-box;transform-origin:50% 0;animation:fyt-dw-tassel 5.2s ease-in-out infinite;animation-delay:inherit}
#fyt-dw-bar .fyt-dw-kin{animation:fyt-dw-glow 2.6s ease-in-out infinite}
#fyt-dw-bar .fyt-dw-lA{left:26px;width:44px}
#fyt-dw-bar .fyt-dw-lB{right:26px;width:44px;animation-delay:-2.1s}
#fyt-dw-bar .fyt-dw-lB .fyt-dw-tas{animation-delay:-1.75s}
#fyt-dw-bar .fyt-dw-lA .fyt-dw-tas{animation-delay:.35s}

/* diyas */
#fyt-dw-bar .fyt-dw-diya{position:absolute;z-index:3;width:58px;pointer-events:none}
#fyt-dw-bar .fyt-dw-diya > svg{display:block;width:100%;height:auto;overflow:visible}
#fyt-dw-bar .fyt-dw-dA{left:78px;bottom:16px}
#fyt-dw-bar .fyt-dw-dB{right:78px;bottom:16px}
#fyt-dw-bar .fyt-dw-flip > svg{transform:scaleX(-1)}
#fyt-dw-bar .fyt-dw-flame{position:absolute;left:93.75%;top:32%;width:0;height:0}
#fyt-dw-bar .fyt-dw-flip .fyt-dw-flame{left:6.25%}
#fyt-dw-bar .fyt-dw-dhalo{position:absolute;left:-55px;top:-70px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,153,51,.2) 35%,rgba(255,153,51,0) 68%);animation:fyt-dw-glow 1.7s ease-in-out infinite}
#fyt-dw-bar .fyt-dw-fsvg{position:absolute;left:-9px;bottom:-3px;width:18px;height:32px;overflow:visible}
#fyt-dw-bar .fyt-dw-fo,#fyt-dw-bar .fyt-dw-fm,#fyt-dw-bar .fyt-dw-fc{transform-box:fill-box;transform-origin:50% 100%}
#fyt-dw-bar .fyt-dw-fo{animation:fyt-dw-flick 1.5s ease-in-out infinite}
#fyt-dw-bar .fyt-dw-fm{animation:fyt-dw-flick 1.1s ease-in-out -.4s infinite}
#fyt-dw-bar .fyt-dw-fc{animation:fyt-dw-flick2 .9s ease-in-out -.2s infinite}
#fyt-dw-bar .fyt-dw-heat{position:absolute;left:-9px;bottom:22px;width:18px;height:24px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,240,210,.22),rgba(255,240,210,0) 70%);animation:fyt-dw-heat 1.8s ease-in-out infinite}
#fyt-dw-bar .fyt-dw-emb{position:absolute;left:-1px;bottom:20px;width:2px;height:2px;border-radius:50%;background:#FFD27A;box-shadow:0 0 4px #FF9933;opacity:0;animation:fyt-dw-ember 2.6s ease-out infinite}
#fyt-dw-bar .fyt-dw-emb:nth-of-type(2){--dx:-6px;animation-delay:.9s}
#fyt-dw-bar .fyt-dw-emb:nth-of-type(3){--dx:5px;animation-delay:1.7s;animation-duration:3s}

/* layout */
#fyt-dw-bar .fyt-dw-inner{position:relative;z-index:4;display:flex;align-items:center;justify-content:center;gap:22px;
  max-width:1400px;margin:0 auto;padding:10px 150px 18px;min-height:96px}
#fyt-dw-bar .fyt-dw-msg{display:flex;align-items:center;justify-content:center;gap:12px;flex:0 0 auto;min-width:0}
#fyt-dw-bar .fyt-dw-hdiya{display:none;position:relative;width:44px;flex:0 0 auto;align-self:flex-end}
#fyt-dw-bar .fyt-dw-hdiya > svg{display:block;width:100%;height:auto;overflow:visible}
#fyt-dw-bar .fyt-dw-text{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;filter:drop-shadow(0 2px 10px rgba(4,7,13,.55))}
#fyt-dw-bar .fyt-dw-eyebrow{position:relative;display:inline-flex;align-items:center;gap:8px;font-family:'Montserrat',Arial,sans-serif;font-weight:700;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#FFD983;padding-left:.32em;line-height:13px}
#fyt-dw-bar .fyt-dw-eyebrow::before,#fyt-dw-bar .fyt-dw-eyebrow::after{content:"";width:26px;height:1px;background:linear-gradient(90deg,rgba(255,200,69,0),#FFC845)}
#fyt-dw-bar .fyt-dw-eyebrow::after{background:linear-gradient(90deg,#FFC845,rgba(255,200,69,0))}
#fyt-dw-bar .fyt-dw-head{position:relative;display:block;white-space:nowrap;font-family:'Montserrat',Arial,sans-serif;font-weight:800;font-size:23px;line-height:26px;letter-spacing:-.01em}
#fyt-dw-bar .fyt-dw-hbase{display:block;color:#fff;background:linear-gradient(180deg,#FFFFFF 0%,#FFF7E2 55%,#FFE3A1 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#fyt-dw-bar .fyt-dw-hbase em{font-style:normal;background:linear-gradient(180deg,#FFF6CF 0%,#FFD053 50%,#FF9A1F 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#fyt-dw-bar .fyt-dw-hshine{position:absolute;left:0;top:0;width:25%;height:100%;overflow:hidden;pointer-events:none;
  -webkit-mask:linear-gradient(90deg,transparent,#000 45%,#000 55%,transparent);mask:linear-gradient(90deg,transparent,#000 45%,#000 55%,transparent);
  transform:translateX(-100%);animation:fyt-dw-shineA 7s linear 1.5s infinite}
#fyt-dw-bar .fyt-dw-hshine > span{display:block;width:400%;color:#fff;-webkit-text-fill-color:#fff;transform:translateX(25%);animation:fyt-dw-shineB 7s linear 1.5s infinite}
#fyt-dw-bar .fyt-dw-hshine em{font-style:normal}
#fyt-dw-bar .fyt-dw-spk{position:absolute;width:10px;height:10px;pointer-events:none;opacity:0;animation:fyt-dw-twinkle 2.8s ease-in-out infinite}
#fyt-dw-bar .fyt-dw-spk::before{content:"";position:absolute;inset:0;background:#FFF4CF;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
#fyt-dw-bar .fyt-dw-spk1{right:-16px;top:-8px}
#fyt-dw-bar .fyt-dw-spk2{left:-14px;bottom:-4px;width:7px;height:7px;animation-delay:1.1s}
#fyt-dw-bar .fyt-dw-spk3{left:46%;top:-12px;width:6px;height:6px;animation-delay:2s}

/* ticket */
#fyt-dw-bar .fyt-dw-ticket{position:relative;flex:0 0 auto;display:flex;align-items:stretch;height:46px;width:200px;cursor:pointer;overflow:hidden;
  -webkit-appearance:none;appearance:none;border:0;border-radius:8px;font:inherit;text-transform:none;letter-spacing:normal;
  box-shadow:inset 0 0 0 1px rgba(255,236,180,.55),inset 0 -8px 16px rgba(120,60,0,.25);
  background:linear-gradient(135deg,#EBC66A 0%,#D9A23E 50%,#B97C24 100%);color:#2A1200;
  -webkit-mask:radial-gradient(circle 7px at 0 50%,transparent 6.5px,#000 7px) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,transparent 6.5px,#000 7px) right/51% 100% no-repeat;
          mask:radial-gradient(circle 7px at 0 50%,transparent 6.5px,#000 7px) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,transparent 6.5px,#000 7px) right/51% 100% no-repeat;
  transition:transform .2s ease}
#fyt-dw-bar .fyt-dw-ticket:hover{transform:translateY(-1px) scale(1.03)}
/* the notch mask clips outlines, so the focus ring is drawn inside the ticket */
#fyt-dw-bar .fyt-dw-ticket:focus{outline:none}
#fyt-dw-bar .fyt-dw-ticket:focus-visible{box-shadow:inset 0 0 0 2px #0B1440,inset 0 0 0 4px #FFFFFF,inset 0 -8px 16px rgba(120,60,0,.25)}
#fyt-dw-bar .fyt-dw-stub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 10px 0 16px;border-right:2px dashed rgba(58,26,0,.38);
  font-family:'Montserrat',Arial,sans-serif;font-weight:800;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5A2D00}
#fyt-dw-bar .fyt-dw-stub svg{width:14px;height:14px}
#fyt-dw-bar .fyt-dw-codewrap{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px 0 10px}
#fyt-dw-bar .fyt-dw-code{font-family:'Montserrat',Arial,sans-serif;font-weight:800;font-size:18px;letter-spacing:.05em;color:#2A1200}
#fyt-dw-bar .fyt-dw-copyico{width:15px;height:15px;opacity:.7;flex:0 0 auto}
#fyt-dw-bar .fyt-dw-ticket::after{content:"";position:absolute;top:-20%;left:0;width:38%;height:140%;pointer-events:none;opacity:.5;
  background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.8) 50%,rgba(255,255,255,0) 100%);transform:translateX(-160%) skewX(-18deg);
  animation:fyt-dw-sheen 6.5s ease-in-out 3s infinite}
#fyt-dw-bar .fyt-dw-ticket .fyt-dw-ok{display:none}
#fyt-dw-bar .fyt-dw-ticket.fyt-dw-copied{background:linear-gradient(135deg,#FFFFFF 0%,#F4F6FB 55%,#E3E8F2 100%);box-shadow:inset 0 0 0 1px rgba(230,181,74,.85),inset 0 -8px 16px rgba(11,20,64,.08)}
#fyt-dw-bar .fyt-dw-ticket.fyt-dw-copied:focus-visible{box-shadow:inset 0 0 0 2px #0B1440,inset 0 0 0 4px #E6B54A}
#fyt-dw-bar .fyt-dw-ticket.fyt-dw-copied .fyt-dw-stub{border-right-color:rgba(11,20,64,.3)}
#fyt-dw-bar .fyt-dw-ticket.fyt-dw-copied .fyt-dw-ok{color:#C8901E}
#fyt-dw-bar .fyt-dw-ticket.fyt-dw-copied::after{opacity:0}
#fyt-dw-bar .fyt-dw-ticket.fyt-dw-copied .fyt-dw-code,#fyt-dw-bar .fyt-dw-ticket.fyt-dw-copied .fyt-dw-stub{color:#0B1440}
#fyt-dw-bar .fyt-dw-ticket.fyt-dw-copied .fyt-dw-ok{display:block}
#fyt-dw-bar .fyt-dw-ticket.fyt-dw-copied .fyt-dw-copyico,#fyt-dw-bar .fyt-dw-ticket.fyt-dw-copied .fyt-dw-tag{display:none}

/* countdown */
#fyt-dw-bar .fyt-dw-timer{position:relative;display:flex;align-items:center;flex:0 0 auto}
#fyt-dw-bar .fyt-dw-ends{font-family:'Montserrat',Arial,sans-serif;font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#FFD983;line-height:10px;white-space:nowrap;position:absolute;left:50%;bottom:100%;margin-bottom:5px;transform:translateX(-50%);padding-left:.22em}
#fyt-dw-bar .fyt-dw-tiles{display:flex;gap:6px}
#fyt-dw-bar .fyt-dw-tile{position:relative;width:42px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;perspective:160px;
  background:linear-gradient(180deg,rgba(9,26,60,.95) 0%,rgba(9,26,60,.95) 50%,rgba(4,9,22,.96) 50%,rgba(4,9,22,.96) 100%);border:1px solid rgba(255,200,69,.38);box-shadow:inset 0 1px 0 rgba(255,226,154,.18),0 4px 12px rgba(4,7,13,.35)}
#fyt-dw-bar .fyt-dw-tile::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.45)}
#fyt-dw-bar .fyt-dw-tile::after{content:"";position:absolute;inset:-1px;border-radius:8px;border:1px solid #FF9933;box-shadow:0 0 14px rgba(255,153,51,.7),inset 0 0 10px rgba(255,153,51,.35);opacity:0;pointer-events:none}
#fyt-dw-bar .fyt-dw-num{display:block;font-family:'Montserrat',Arial,sans-serif;font-weight:800;font-size:18px;line-height:1;color:#fff;font-variant-numeric:tabular-nums;transform-origin:50% 60%}
#fyt-dw-bar .fyt-dw-lbl{margin-top:4px;font-family:'Montserrat',Arial,sans-serif;font-weight:700;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#F2C25B}
#fyt-dw-bar .fyt-dw-lbl .fyt-dw-ls{display:none}
#fyt-dw-bar .fyt-dw-flipping .fyt-dw-num{animation:fyt-dw-flipin .5s cubic-bezier(.3,1.4,.5,1)}
#fyt-dw-bar.fyt-dw-soon .fyt-dw-tile{border-color:rgba(255,153,51,.9);background:linear-gradient(180deg,#3A1A08 0%,#1E0E06 50%,#160A04 100%);box-shadow:0 0 10px rgba(255,153,51,.35)}
#fyt-dw-bar.fyt-dw-soon .fyt-dw-lbl{color:#FFB15C}
#fyt-dw-bar.fyt-dw-soon .fyt-dw-tile::after{animation:fyt-dw-glow2 1.6s ease-in-out infinite}
#fyt-dw-bar.fyt-dw-soon .fyt-dw-ends{color:#FFB15C}
#fyt-dw-bar .fyt-dw-over{display:none;height:46px;align-items:center;box-sizing:border-box;font-family:'Montserrat',Arial,sans-serif;font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#FFE29A;
  padding:0 18px;border-radius:8px;border:1px solid rgba(255,200,69,.45);background:rgba(4,7,13,.6)}

/* CTA */
#fyt-dw-bar .fyt-dw-cta{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;overflow:hidden;
  font-family:'Montserrat',Arial,sans-serif;font-weight:800;font-size:14px;letter-spacing:.01em;color:#fff!important;text-decoration:none!important;white-space:nowrap;
  background:linear-gradient(180deg,#5A9BFF,#2563EB);box-shadow:0 6px 18px rgba(37,99,235,.5),inset 0 1px 0 rgba(255,255,255,.35),0 0 0 1px rgba(255,214,120,.5);transition:transform .2s ease}
#fyt-dw-bar .fyt-dw-cta:hover{transform:scale(1.035)}
#fyt-dw-bar .fyt-dw-cta:focus-visible{outline:2px solid #FFE29A;outline-offset:3px}
#fyt-dw-bar .fyt-dw-cta svg{width:15px;height:15px;transition:transform .2s ease}
#fyt-dw-bar .fyt-dw-cta:hover svg{transform:translateX(3px)}
#fyt-dw-bar .fyt-dw-cta .fyt-dw-ctas{display:none}
#fyt-dw-bar .fyt-dw-cta::after{content:"";position:absolute;top:0;left:0;width:45%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:translateX(-140%) skewX(-20deg);animation:fyt-dw-sheen 4.5s ease-in-out 2s infinite}

/* fairy lights */
#fyt-dw-bar .fyt-dw-lights{position:absolute;left:0;right:0;bottom:0;height:16px;z-index:2;pointer-events:none}
#fyt-dw-bar .fyt-dw-wire{position:absolute;left:0;top:0;width:100%;height:12px}
#fyt-dw-bar .fyt-dw-bulb{position:absolute;top:6px;width:5px;height:7px;margin-left:-2.5px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:var(--c);
  box-shadow:0 0 5px 1px var(--c),0 0 12px 2px var(--c);animation:fyt-dw-bulb 2.4s ease-in-out infinite}
#fyt-dw-bar .fyt-dw-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ended */
#fyt-dw-bar.fyt-dw-ended .fyt-dw-tiles,#fyt-dw-bar.fyt-dw-ended .fyt-dw-ends,#fyt-dw-bar.fyt-dw-ended .fyt-dw-ticket{display:none}
#fyt-dw-bar.fyt-dw-ended .fyt-dw-over{display:flex}
#fyt-dw-bar.fyt-dw-paused *,#fyt-dw-bar.fyt-dw-paused *::before,#fyt-dw-bar.fyt-dw-paused *::after{animation-play-state:paused!important}

/* keyframes: transform / opacity only */
@keyframes fyt-dw-sway{0%,100%{transform:rotate(3.5deg)}50%{transform:rotate(-3.5deg)}}
@keyframes fyt-dw-tassel{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes fyt-dw-glow{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes fyt-dw-glow2{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fyt-dw-flick{0%,100%{transform:scale(1,1) rotate(-2deg)}30%{transform:scale(.93,1.07) rotate(2.5deg)}55%{transform:scale(1.05,.95) rotate(-1deg)}80%{transform:scale(.97,1.04) rotate(3deg)}}
@keyframes fyt-dw-flick2{0%,100%{transform:scale(1,1);opacity:1}50%{transform:scale(.9,1.12);opacity:.85}}
@keyframes fyt-dw-heat{0%,100%{transform:translateY(0) scaleX(1);opacity:.5}50%{transform:translateY(-6px) scaleX(1.25);opacity:1}}
@keyframes fyt-dw-ember{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx,3px),-30px);opacity:0}}
@keyframes fyt-dw-twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}70%{opacity:0;transform:scale(.4) rotate(90deg)}}
@keyframes fyt-dw-sheen{0%,60%{transform:translateX(-160%) skewX(-18deg)}100%{transform:translateX(320%) skewX(-18deg)}}
@keyframes fyt-dw-shineA{0%{transform:translateX(-100%)}35%,100%{transform:translateX(400%)}}
@keyframes fyt-dw-shineB{0%{transform:translateX(25%)}35%,100%{transform:translateX(-100%)}}
@keyframes fyt-dw-bulb{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes fyt-dw-flipin{0%{transform:rotateX(-90deg);opacity:.2}100%{transform:rotateX(0);opacity:1}}
@keyframes fyt-dw-spin{to{transform:rotate(360deg)}}
