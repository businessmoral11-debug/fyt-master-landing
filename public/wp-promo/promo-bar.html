<!-- FYT BLACK FRIDAY TOP BAR v1.1, thin on scroll (paste-in snippet, vanilla JS, no images, no libraries)
  Paste once: WordPress Custom HTML block or header/footer hook (wp_body_open / wp_footer), same as the Diwali bar.
  It moves itself to the top of <body>, stays fixed while scrolling and pads the page so nothing is covered.
  Exposes --fyt-bf-h (bar height) on <html> so a sticky site header can use top:var(--fyt-bf-h,0px).
  Edit CONFIG in the <script> below, or set window.FYT_BF_CONFIG={...} before this snippet. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
#fyt-bf-bar,#fyt-bf-bar *{box-sizing:border-box;margin:0;padding:0}
#fyt-bf-bar{--b1:#0767F7;--b2:#348CFC;--gd:#FFC845;position:relative;z-index:99990;width:100%;height:76px;overflow:hidden;isolation:isolate;color:#fff;font:500 13px/1.2 Inter,Arial,sans-serif;text-align:left;-webkit-font-smoothing:antialiased;background:#03060C;box-shadow:0 8px 26px rgba(0,0,0,.5)}
#fyt-bf-bar.fbf-fixed{position:fixed;left:0;right:0;top:var(--fbf-top,0px)}
#fyt-bf-bar.fbf-sticky{position:sticky;top:var(--fbf-top,0px)}
#fyt-bf-bar.fbf-hide{display:none!important}
#fyt-bf-bar .fbf-bg{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(40% 160% at 50% 120%,rgba(7,103,247,.55),transparent 70%),radial-gradient(22% 140% at 12% -20%,rgba(52,140,252,.35),transparent 70%),radial-gradient(22% 140% at 88% -20%,rgba(52,140,252,.35),transparent 70%),linear-gradient(90deg,#03060C,#061433 35%,#0A2466 50%,#061433 65%,#03060C);background-size:200% 100%,100% 100%,100% 100%,100% 100%;animation:fbf-aur 9s ease-in-out infinite alternate}
#fyt-bf-bar .fbf-grid{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.22;background:repeating-linear-gradient(90deg,rgba(120,170,255,.18) 0 1px,transparent 1px 28px);-webkit-mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
#fyt-bf-bar .fbf-sweep{position:absolute;top:0;bottom:0;left:-30%;width:22%;z-index:4;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.13) 45%,rgba(255,255,255,.22) 50%,transparent 60%);transform:skewX(-18deg);animation:fbf-sweep 6s ease-in-out infinite}
#fyt-bf-bar .fbf-line{position:absolute;left:0;right:0;bottom:0;height:2px;z-index:5;pointer-events:none;background:linear-gradient(90deg,transparent,var(--b2) 20%,var(--gd) 50%,var(--b2) 80%,transparent);background-size:200% 100%;animation:fbf-run 3s linear infinite;box-shadow:0 0 10px var(--b2)}
#fyt-bf-bar .fbf-spk{position:absolute;z-index:1;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(140,190,255,.8);opacity:0;animation:fbf-tw 3.2s ease-in-out infinite}
#fyt-bf-bar .fbf-in{position:relative;z-index:3;height:100%;max-width:1320px;margin:0 auto;padding:0 44px 0 20px;display:flex;align-items:center;justify-content:center;gap:22px}
#fyt-bf-bar .fbf-brand{font:800 17px/.95 Unbounded,Arial Black,sans-serif;letter-spacing:-.02em;white-space:nowrap;flex:none}
#fyt-bf-bar .fbf-brand span{display:block}
#fyt-bf-bar .fbf-bk{background:linear-gradient(180deg,#fff 30%,#AFC3E6);-webkit-background-clip:text;background-clip:text;color:transparent}
#fyt-bf-bar .fbf-fr,#fyt-bf-bar .fbf-g{background:linear-gradient(90deg,var(--b1),var(--b2) 40%,#9CD0FF 50%,var(--b2) 60%,var(--b1));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fbf-run 4s linear infinite}
#fyt-bf-bar .fbf-cards{position:relative;width:54px;height:40px;flex:none}
#fyt-bf-bar .fbf-cards i{position:absolute;left:19px;top:3px;width:20px;height:30px;border-radius:4px;transform-origin:50% 120%;background:linear-gradient(155deg,rgba(255,255,255,.95),rgba(190,215,255,.55));border:1px solid rgba(255,255,255,.9);box-shadow:0 0 10px rgba(140,190,255,.75);animation:fbf-fan 5s cubic-bezier(.3,1.3,.5,1) infinite}
#fyt-bf-bar .fbf-cards i:nth-child(-n+2){background:linear-gradient(155deg,var(--b2),var(--b1));border-color:#8FC0FF}
#fyt-bf-bar .fbf-cards i:nth-child(1){--r:-36deg}#fyt-bf-bar .fbf-cards i:nth-child(2){--r:-18deg}#fyt-bf-bar .fbf-cards i:nth-child(3){--r:0deg}#fyt-bf-bar .fbf-cards i:nth-child(4){--r:18deg}#fyt-bf-bar .fbf-cards i:nth-child(5){--r:36deg}
#fyt-bf-bar .fbf-offer{flex:none}
#fyt-bf-bar .fbf-eb{display:none;font:800 10px/1 Unbounded,Arial Black,sans-serif;letter-spacing:.22em;margin-bottom:5px}
#fyt-bf-bar .fbf-br{display:none}
#fyt-bf-bar .fbf-head{font:800 21px/1.1 Unbounded,Arial Black,sans-serif;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:9px}
#fyt-bf-bar .fbf-n5{display:inline-block;animation:fbf-pop 2.5s ease-in-out infinite}
#fyt-bf-bar .fbf-off{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:7px;font-size:15px;color:#1A1000;background:linear-gradient(100deg,#FFB800,#FFE08A 45%,#FFF6D6 50%,#FFE08A 55%,#FFB800);background-size:250% 100%;animation:fbf-run 3s linear infinite;box-shadow:0 0 16px rgba(255,200,69,.45)}
#fyt-bf-bar .fbf-tick,#fyt-bf-bar .fbf-slides{position:relative;overflow:hidden;display:grid}
#fyt-bf-bar .fbf-tick{height:18px;margin-top:5px;font-size:12.5px;font-weight:600;color:#DCE8FF}
#fyt-bf-bar .fbf-tick>span,#fyt-bf-bar .fbf-slides>span{grid-area:1/1;min-width:0;white-space:nowrap;opacity:0;transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
#fyt-bf-bar .fbf-tick>span.on,#fyt-bf-bar .fbf-slides>span.on{opacity:1;transform:none}
#fyt-bf-bar .fbf-tick>span.out,#fyt-bf-bar .fbf-slides>span.out{opacity:0;transform:translateY(-100%)}
#fyt-bf-bar b.fbf-gd{color:var(--gd);font-weight:800}
#fyt-bf-bar .fbf-slides{display:none;grid-template-columns:minmax(0,1fr)}
#fyt-bf-bar .fbf-code{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1.5px dashed rgba(255,200,69,.8);border-radius:9px;background:rgba(255,200,69,.08);color:#fff;font:600 10px/1 Inter,Arial,sans-serif;letter-spacing:.14em;cursor:pointer;transition:background .2s,transform .2s}
#fyt-bf-bar .fbf-code:hover{background:rgba(255,200,69,.18);transform:translateY(-1px)}
#fyt-bf-bar .fbf-code b{font:800 15px/1 Unbounded,Arial Black,sans-serif;letter-spacing:.01em;color:var(--gd)}
#fyt-bf-bar .fbf-code svg{width:14px;height:14px;opacity:.85}
#fyt-bf-bar .fbf-code.fbf-ok{border-style:solid;border-color:#3BE38B;background:rgba(59,227,139,.14)}
#fyt-bf-bar .fbf-code.fbf-ok b{color:#3BE38B}
#fyt-bf-bar .fbf-timer{flex:none;display:flex;align-items:center;gap:8px}
#fyt-bf-bar .fbf-ends{font:700 9.5px/1.15 Inter,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#A9C4F0;width:52px}
#fyt-bf-bar .fbf-tiles{display:flex;gap:4px}
#fyt-bf-bar .fbf-t{width:40px;height:44px;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#0E1A33,#050A16);border:1px solid rgba(110,160,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
#fyt-bf-bar .fbf-t b{display:block;font:800 17px/1 Unbounded,Arial Black,sans-serif;font-variant-numeric:tabular-nums}
#fyt-bf-bar .fbf-t small{font:700 8px/1 Inter,Arial,sans-serif;letter-spacing:.12em;color:#8FB2EA;margin-top:4px}
#fyt-bf-bar .fbf-t.fbf-flip b{animation:fbf-dig .45s cubic-bezier(.2,.8,.2,1)}
#fyt-bf-bar.fbf-soon .fbf-t{border-color:rgba(255,200,69,.7);box-shadow:0 0 12px rgba(255,200,69,.3)}
#fyt-bf-bar.fbf-soon .fbf-ends{color:var(--gd)}
#fyt-bf-bar .fbf-lim,#fyt-bf-bar .fbf-over{display:none;font:800 11px/1 Unbounded,Arial Black,sans-serif;letter-spacing:.06em;padding:9px 12px;border-radius:8px;border:1px solid rgba(110,160,255,.45);background:rgba(7,103,247,.15);white-space:nowrap}
#fyt-bf-bar.fbf-nodate .fbf-ends,#fyt-bf-bar.fbf-nodate .fbf-tiles,#fyt-bf-bar.fbf-ended .fbf-ends,#fyt-bf-bar.fbf-ended .fbf-tiles{display:none}
#fyt-bf-bar.fbf-nodate .fbf-lim,#fyt-bf-bar.fbf-ended .fbf-over{display:block}
#fyt-bf-bar .fbf-cta{position:relative;flex:none;order:9;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;overflow:hidden;font:800 12.5px/1 Unbounded,Arial Black,sans-serif;letter-spacing:.02em;color:#fff!important;text-decoration:none!important;white-space:nowrap;background:linear-gradient(180deg,#4C9BFF,var(--b1));box-shadow:0 0 0 0 rgba(52,140,252,.6),0 6px 18px rgba(7,103,247,.55),inset 0 1px 0 rgba(255,255,255,.35);animation:fbf-pulse 2.2s ease-out infinite;transition:transform .2s}
#fyt-bf-bar .fbf-cta:hover{transform:translateY(-1px) scale(1.03)}
#fyt-bf-bar .fbf-cta::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:fbf-sweep 3.2s ease-in-out infinite}
#fyt-bf-bar .fbf-cta svg{width:15px;height:15px}
#fyt-bf-bar .fbf-cs{display:none}
#fyt-bf-bar :focus-visible{outline:2px solid #fff;outline-offset:2px}
#fyt-bf-bar .fbf-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes fbf-aur{to{background-position:100% 0,0 0,0 0,0 0}}
@keyframes fbf-sweep{0%,55%{left:-60%}100%{left:130%}}
@keyframes fbf-run{to{background-position:-200% 0}}
@keyframes fbf-tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes fbf-fan{0%,4%{transform:rotate(0)}18%,86%{transform:rotate(var(--r))}96%,100%{transform:rotate(0)}}
@keyframes fbf-pop{0%,70%,100%{transform:none;text-shadow:none}80%{transform:scale(1.18);text-shadow:0 0 14px #6FB2FF}}
@keyframes fbf-dig{from{transform:translateY(-35%);opacity:.25}to{transform:none;opacity:1}}
@keyframes fbf-pulse{0%{box-shadow:0 0 0 0 rgba(52,140,252,.6),0 6px 18px rgba(7,103,247,.55),inset 0 1px 0 rgba(255,255,255,.35)}70%,100%{box-shadow:0 0 0 12px rgba(52,140,252,0),0 6px 18px rgba(7,103,247,.55),inset 0 1px 0 rgba(255,255,255,.35)}}
@media (max-width:1359px){#fyt-bf-bar .fbf-brand{display:none}#fyt-bf-bar .fbf-eb{display:block}#fyt-bf-bar .fbf-in{gap:18px}#fyt-bf-bar .fbf-head{font-size:19px}#fyt-bf-bar .fbf-off{font-size:14px;height:24px}}
@media (max-width:1180px){#fyt-bf-bar .fbf-cards,#fyt-bf-bar .fbf-ends,#fyt-bf-bar .fbf-code span{display:none!important}#fyt-bf-bar .fbf-in{gap:16px}#fyt-bf-bar .fbf-t{width:36px}}

#fyt-bf-bar{height:108px}

#fyt-bf-bar .fbf-in{flex-wrap:wrap;align-content:center;gap:8px 14px;max-width:660px;padding:8px 12px}

#fyt-bf-bar .fbf-cta{height:38px;padding:0 15px;font-size:12px}#fyt-bf-bar .fbf-cl{display:none}#fyt-bf-bar .fbf-cs{display:inline}

}
@media (max-width:370px){#fyt-bf-bar .fbf-code svg{display:none}#fyt-bf-bar .fbf-t{width:29px}#fyt-bf-bar .fbf-in{padding:8px}}

</style>

<script>
(function(){
  /* ============================ CONFIG (edit here) ============================ */
  var CONFIG = {
    endDate: '2026-12-01T17:00:00+05:30',  // PLACEHOLDER. Set like '2026-11-30T23:59:59+05:30' (IST). Until set, a "LIMITED TIME" chip shows instead of the countdown.
    couponCode: 'BLACKFRIDAY', // shown on the ticket, copied on click
    ctaUrl: 'https://fundingyourtrades.com/#challenge',
    ctaText: 'Claim 5 Accounts', ctaTextShort: 'Claim', ctaNewTab: false,
    // Desktop/tablet line under the headline (rotates). Wrap words in [[ ]] to make them gold.
    ticker: ['Every purchase = 1 entry to win a [[$100K funded account]]', 'Pay for 2 accounts, get 5. [[All the same size.]]', 'Use code [[BLACKFRIDAY]] at checkout'],
    // Phone slides: [small top line, big line]
    slides: [['BLACK FRIDAY', 'BUY [[2]] GET [[5]]'], ['BUY 2 GET 5, PLUS', '[[50% OFF]]'], ['1 ENTRY WITH EVERY PURCHASE', '[[$100K]] FUNDED ACCOUNT']],
    srText: 'Black Friday: Buy 2 Get 5 plus 50% off. Every purchase is 1 entry to win a $100K funded account.',
    rotateMs: 3200,
    soonHours: 24, soonText: 'Ends soon',
    whenEnded: 'hide',        // 'hide' removes the bar | 'message' shows endedText
    endedText: 'DEAL ENDED',
    stickyMode: 'fixed',      // 'fixed' (pads <body>) | 'sticky' | 'none' (stays where pasted)
    thinOnScroll: true, thinAfter: 80, // bar gets thin once the page is scrolled this many pixels
    zIndex: 99990
  };
  /* =========================================================================== */
  if (window.FYT_BF_CONFIG) for (var k in window.FYT_BF_CONFIG) CONFIG[k] = window.FYT_BF_CONFIG[k];
  var bar = document.getElementById('fyt-bf-bar');
  if (!bar || bar.getAttribute('data-init')) return; bar.setAttribute('data-init', '1');
  // No promo bar on the checkout: nothing should pull the eye away from paying.
  if (document.getElementById('fyt-custom-checkout') || /\/checkout(\/|$)/.test(location.pathname)) { if (bar.parentNode) bar.parentNode.removeChild(bar); return; }
  var $ = function(s){ return bar.querySelector(s); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var esc = function(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var gold = function(t){ return esc(t).replace(/\[\[(.+?)\]\]/g, '<b class="fbf-gd">$1</b>'); };
  bar.style.zIndex = CONFIG.zIndex;
  $('.fbf-full').textContent = CONFIG.srText;
  $('.fbf-cv').textContent = CONFIG.couponCode;
  var code = $('.fbf-code'); code.setAttribute('aria-label', 'Copy coupon code ' + CONFIG.couponCode);
  var cta = $('.fbf-cta'); cta.href = CONFIG.ctaUrl; cta.setAttribute('aria-label', CONFIG.ctaText);
  $('.fbf-cl').textContent = CONFIG.ctaText; $('.fbf-cs').textContent = CONFIG.ctaTextShort || CONFIG.ctaText;
  if (CONFIG.ctaNewTab) { cta.target = '_blank'; cta.rel = 'noopener'; }
  $('.fbf-over').textContent = CONFIG.endedText;
  $('.fbf-tick').innerHTML = CONFIG.ticker.map(function(t){ return '<span>' + gold(t) + '</span>'; }).join('');
  $('.fbf-slides').innerHTML = CONFIG.slides.map(function(s){ return '<span><small>' + gold(s[0]) + '</small><em>' + gold(s[1]).replace(/fbf-gd/g, 'fbf-g') + '</em></span>'; }).join('');
  bar.querySelectorAll('.fbf-slides em b').forEach(function(b){ if (/%|\$/.test(b.textContent)) b.className = 'fbf-gd'; });
  /* sparkles */
  if (!reduce) for (var i = 0; i < 9; i++) { var s = document.createElement('i'); s.className = 'fbf-spk'; s.setAttribute('aria-hidden', 'true');
    s.style.cssText = 'left:' + (3 + i * 10.6 + Math.random() * 4).toFixed(1) + '%;top:' + (12 + Math.random() * 70).toFixed(0) + '%;animation-delay:' + (-Math.random() * 3.2).toFixed(2) + 's'; bar.appendChild(s); }

  function rotator(box){ var items = box.children, n = items.length, idx = 0; if (!n) return; items[0].classList.add('on');

  function fit(){ bar.querySelectorAll('.fbf-slides em,.fbf-slides small').forEach(function(e){ e.style.fontSize = ''; var f = parseFloat(getComputedStyle(e).fontSize); while (e.scrollWidth > e.clientWidth + 1 && f > 7) { f -= .5; e.style.fontSize = f + 'px'; } }); }
  function sched(){ if (!raf) raf = requestAnimationFrame(place); }
  function unplace(){ root.style.removeProperty('--fyt-bf-h'); if (basePad !== null) body.style.paddingTop = basePad ? basePad + 'px' : ''; }
  if (CONFIG.stickyMode === 'fixed') { if (bar.parentNode !== body) body.insertBefore(bar, body.firstChild); bar.classList.add('fbf-fixed'); }
  else if (CONFIG.stickyMode === 'sticky') bar.classList.add('fbf-sticky');
  place(); addEventListener('resize', sched);
  if (CONFIG.thinOnScroll) { var onScroll = function(){ var thin = (window.pageYOffset || root.scrollTop || 0) > CONFIG.thinAfter; if (thin !== bar.classList.contains('fbf-thin')) { bar.classList.toggle('fbf-thin', thin); setTimeout(sched, 300); } }; addEventListener('scroll', onScroll, { passive: true }); onScroll(); } if (adminBar) addEventListener('scroll', sched, { passive: true });
  /* countdown */
  var end = new Date(CONFIG.endDate).getTime(), tiles = {}, prev = {}, lastMin = -1, timer = null, tsr = $('.fbf-tsr'), endsEl = $('.fbf-ends'), endsTxt = endsEl.textContent;
  ['d','h','m','s'].forEach(function(u){ tiles[u] = bar.querySelector('.fbf-t[data-u="' + u + '"]'); });
  var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
  function tick(){ var left = end - Date.now();
    if (!(left > 0)) { clearInterval(timer); if (CONFIG.whenEnded === 'hide') { bar.classList.add('fbf-hide'); unplace(); } else { bar.classList.add('fbf-ended'); tsr.textContent = CONFIG.endedText; } return; }
    var soon = left <= CONFIG.soonHours * 36e5; if (soon !== bar.classList.contains('fbf-soon')) { bar.classList.toggle('fbf-soon', soon); endsEl.textContent = soon ? CONFIG.soonText : endsTxt; }

  var cv = $('.fbf-cv'), csr = $('.fbf-csr'), rt;
  function legacy(t){ var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
    body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch(e){} body.removeChild(ta); return ok; }

    else csr.textContent = 'Code: ' + CONFIG.couponCode;
    rt = setTimeout(function(){ code.classList.remove('fbf-ok'); cv.textContent = CONFIG.couponCode; csr.textContent = ''; }, 2000); }
  code.addEventListener('click', function(){ var c = CONFIG.couponCode;
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(c).then(function(){ done(true); }, function(){ done(legacy(c)); }); else done(legacy(c)); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sched);
})();

<!-- ===================== Site-wide: point every Discord link to the current invite ===================== -->
<script>
(function(){
  var NEW = 'https://discord.gg/6NYNSAwxeZ';
  function fix(root){
    var links = (root || document).querySelectorAll('a[href*="discord.gg/"],a[href*="discord.com/invite/"]');
    for (var i = 0; i < links.length; i++) { if (links[i].href !== NEW) links[i].href = NEW; }
  }
  fix();
  if (window.MutationObserver) {
    var mo = new MutationObserver(function(){ fix(); });
    mo.observe(document.documentElement, { childList: true, subtree: true });
    setTimeout(function(){ mo.disconnect(); }, 15000);
  }
})();
</script>
