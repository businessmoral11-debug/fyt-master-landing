<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>FYT Trading Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        * {
            font-family: 'Poppins', Arial, sans-serif !important;
        }

        /* ── ROW / GROUP ── */
        .fyt-group {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 10px !important;
            margin-bottom: 14px !important;
            width: 100% !important
        }

        /* ── BUTTONS ── */
        .fyt-btn {
            position: relative !important;
            flex: 1 1 calc(33.33% - 10px) !important;
            min-width: 90px !important;
            padding: 13px 10px !important;
            border-radius: 14px !important;
            border: 1.5px solid #d6d8ff !important;
            background: #fff !important;
            color: #393be7 !important;
            font-family: 'Inter', Arial, sans-serif !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            transition: all 0.2s ease !important;
            text-align: center !important;
            box-shadow: 0 1px 4px rgba(57, 59, 231, 0.06) !important;
        }

        .fyt-btn:hover {
            background: #f0f1ff !important;
            border-color: #393be7 !important;
            transform: translateY(-1px) !important
        }

        .fyt-btn.active {
            background: #393be7 !important;
            color: #fff !important;
            border-color: #393be7 !important;
            box-shadow: 0 4px 16px rgba(57, 59, 231, 0.28) !important
        }

        /* amount buttons slightly shorter */
        .fyt-btn.amt {
            padding: 11px 10px !important;
            font-size: 14px !important
        }

        /* ── BADGE ── */
        .fyt-badge {
            position: absolute !important;
            top: -9px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            background: linear-gradient(90deg, #ff6b35, #f7931e) !important;
            color: #fff !important;
            font-size: 9px !important;
            font-weight: 800 !important;
            padding: 3px 10px !important;
            border-radius: 999px !important;
            white-space: nowrap !important;
            letter-spacing: 0.06em !important;
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.35) !important;
            animation: badgePulse 2s ease-in-out infinite !important;
            pointer-events: none !important;
        }

        @keyframes badgePulse {

            0%,
            100% {
                box-shadow: 0 2px 8px rgba(255, 107, 53, 0.35) !important
            }

            50% {
                box-shadow: 0 4px 14px rgba(255, 107, 53, 0.55) !important
            }
        }

        /* ── SECTION LABEL ── */
        .fyt-label {
            font-size: 11px !important;
            font-weight: 700 !important;
            letter-spacing: 0.1em !important;
            text-transform: uppercase !important;
            color: #888 !important;
            margin-bottom: 8px !important;
            text-align: center !important;
        }

        /* ── CARD ── */
        .fyt-card {
            background: #f7f8ff !important;
            border-radius: 18px !important;
            padding: 28px 24px 24px !important;
            text-align: center !important;
            border: 1.5px solid #e8eaff !important;
            margin-top: 4px !important;
        }

        /* platform row inside card */
        .fyt-platform-row {
            display: flex !important;
            gap: 8px !important;
            justify-content: center !important;
            margin-bottom: 20px !important
        }

        .fyt-plat-pill {
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
            padding: 7px 16px !important;
            border-radius: 999px !important;
            border: 1.5px solid #d6d8ff !important;
            background: #fff !important;
            font-size: 13px !important;
            font-weight: 600 !important;
            color: #555 !important;
            cursor: pointer !important;
            transition: all 0.2s !important;
        }

        .fyt-plat-pill img {
            width: 18px !important;
            height: 18px !important;
            border-radius: 50% !important;
            object-fit: contain !important
        }

        .fyt-plat-pill:hover {
            border-color: #393be7 !important;
            color: #393be7 !important
        }

        .fyt-plat-pill.active {
            background: #393be7 !important;
            color: #fff !important;
            border-color: #393be7 !important;
            box-shadow: 0 3px 12px rgba(57, 59, 231, 0.22) !important
        }

        /* type badge inside card */
        .fyt-type-chip {
            display: inline-block !important;
            background: #eef0ff !important;
            color: #393be7 !important;
            border-radius: 999px !important;
            padding: 4px 14px !important;
            font-size: 11px !important;
            font-weight: 700 !important;
            letter-spacing: 0.08em !important;
            text-transform: uppercase !important;
            margin-bottom: 14px !important;
        }

        /* acct size */
        .fyt-acct {
            font-size: 13px !important;
            color: #888 !important;
            margin-bottom: 16px !important
        }

        .fyt-acct strong {
            color: #1a1a2e !important;
            font-weight: 700 !important
        }

        /* PRICE */

        .fyt-price-row {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 12px !important;
            margin-bottom: 8px !important;
        }

        .fyt-price-old {
            font-size: 20px !important;
            font-weight: 600 !important;
            color: #bbb !important;
            text-decoration: line-through !important;
        }

        .fyt-price-new {
            font-size: 52px !important;
            font-weight: 800 !important;
            color: #1a1a2e !important;
            line-height: 1 !important;
            letter-spacing: -0.03em !important;
        }

        .fyt-price-meta {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 10px !important;
            flex-wrap: wrap !important;
            margin-bottom: 10px !important
        }

        .fyt-refund {
            font-size: 12px !important;
            font-weight: 700 !important;
            color: #22c47a !important;
            background: #e8faf2 !important;
            border-radius: 999px !important;
            padding: 3px 12px !important;
            letter-spacing: 0.06em !important
        }

        .fyt-coupon {
            font-size: 12px !important;
            color: #888 !important;
            font-weight: 500 !important
        }

        .fyt-coupon strong {
            color: #f7931e !important
        }

        .fyt-coupon-code {
            text-align: center !important;
            font-size: 12px !important;
            color: #888 !important;
            margin-bottom: 4px !important;
        }

        .fyt-coupon-code strong {
            color: #393be7 !important;
            font-weight: 700 !important;
        }

        /* savings pill */
        .fyt-savings {
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
            background: #fff3e8 !important;
            border: 1px solid #ffd6a8 !important;
            border-radius: 999px !important;
            padding: 5px 14px !important;
            font-size: 12px !important;
            font-weight: 700 !important;
            color: #e07020 !important;
            margin-bottom: 20px !important;
        }

        /* CTA */
        .fyt-cta {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 10px !important;
            width: 100% !important;
            padding: 17px 24px !important;
            background: #393be7 !important;
            color: #fff !important;
            border: none !important;
            border-radius: 999px !important;
            font-family: 'Inter', Arial, sans-serif !important;
            font-size: 17px !important;
            font-weight: 800 !important;
            cursor: pointer !important;
            letter-spacing: 0.01em !important;
            box-shadow: 0 6px 20px rgba(57, 59, 231, 0.28) !important;
            transition: all 0.25s !important;
            animation: ctaPulse 2.2s ease-in-out infinite !important;
            position: relative !important;
            overflow: hidden !important;
        }

        .fyt-cta::after {
            content: '' !important;
            position: absolute !important;
            inset: 0 !important;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent) !important;
            transform: translateX(-100%) !important;
            transition: transform 0.6s !important;
        }

        .fyt-cta:hover::after {
            transform: translateX(100%) !important
        }

        .fyt-cta:hover {
            background: #2a2cb8 !important;
            box-shadow: 0 10px 28px rgba(57, 59, 231, 0.4) !important;
            animation-play-state: paused !important;
            transform: translateY(-2px) !important
        }

        @keyframes ctaPulse {

            0%,
            100% {
                box-shadow: 0 6px 20px rgba(57, 59, 231, 0.28) !important
            }

            50% {
                box-shadow: 0 8px 28px rgba(57, 59, 231, 0.44) !important
            }
        }

        /* CTA play icon circle */
        .fyt-cta-icon {
            width: 36px !important;
            height: 36px !important;
            border-radius: 50% !important;
            background: rgba(255, 255, 255, 0.22) !important;
            display: grid !important;
            place-items: center !important;
            flex-shrink: 0 !important;
            font-size: 16px !important;
        }

        /* empty */
        .fyt-empty {
            padding: 32px !important;
            color: #aaa !important;
            font-size: 14px !important;
            text-align: center !important
        }

        /* ── RESPONSIVE ── */
        @media(max-width:600px) {
            .fyt-btn {
                font-size: 13px !important;
                padding: 11px 6px !important
            }

            .fyt-price-new {
                font-size: 40px !important
            }

            .fyt-cta {
                font-size: 15px !important;
                padding: 15px 18px !important
            }

            .fyt-card {
                padding: 20px 14px 18px !important
            }
        }

        @media(max-width:400px) {
            .fyt-btn {
                flex: 1 1 calc(50% - 8px) !important;
                font-size: 12px !important
            }
        }
    </style>
</head>

            document.querySelectorAll("[data-plat]").forEach(b => {
